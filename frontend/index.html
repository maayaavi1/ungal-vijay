<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>உங்கள் விஜய்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F1;
  --text: #202923;
  --muted: #5e6c62;
  --green: #245B46;
  --green-glow: rgba(36, 91, 70, 0.28);
  --red: #C83D36;
  --red-glow: rgba(200, 61, 54, 0.28);
  --font: 'Plus Jakarta Sans', 'Noto Sans Tamil', -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.app-container {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  height: 100%;
  padding-top: max(32px, env(safe-area-inset-top, 24px));
  padding-bottom: max(36px, env(safe-area-inset-bottom, 24px));
  padding-left: 20px;
  padding-right: 20px;
}

/* 1. Centered Stacked Header: 72px Portrait + Title */
.header-lockup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 10;
  padding-top: 10px;
}

.avatar-frame {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 
    0 1px 3px rgba(32, 41, 35, 0.08),
    0 10px 24px -6px rgba(32, 41, 35, 0.16);
  border: 1px solid rgba(32, 41, 35, 0.08);
  background: #eae8e1;
}

.avatar-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  display: block;
}

.title-shimmer {
  margin-top: 18px;
  font-size: 1.28rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text);
  background: linear-gradient(
    110deg,
    #202923 0%,
    #202923 35%,
    #5f776a 48%,
    #8fb5a2 50%,
    #5f776a 52%,
    #202923 65%,
    #202923 100%
  );
  background-size: 240% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: goldShimmer 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes goldShimmer {
  0% { background-position: 120% 0; }
  60% { background-position: -120% 0; }
  100% { background-position: -120% 0; }
}

/* 2. Middle Area */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 480px;
  position: relative;
}

/* State 1: Idle Prompt */
.idle-prompt {
  font-size: 1.08rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--muted);
  text-align: center;
  max-width: 290px;
  letter-spacing: -0.01em;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

body.call .idle-prompt {
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  display: none;
}

/* State 2: Active Call Stage */
.call-stage {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 22px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

body.call .call-stage {
  display: flex;
  opacity: 1;
  transform: translateY(0);
}

/* Equalizer Container (25 Capsule Bars) */
.equalizer-container {
  width: 70%;
  max-width: 320px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas#eq {
  width: 100%;
  height: 100%;
  display: block;
}

/* Subtitle Stream (Max 3 lines, fixed container height, subtle faded appearance) */
.subtitle-stream {
  min-height: 48px;
  max-height: 4.2em;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  overflow: hidden;
}

.subtitle-text {
  font-size: 0.84rem;
  font-weight: 500;
  line-height: 1.45;
  color: var(--muted);
  text-align: center;
  letter-spacing: -0.01em;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.45s ease;
}

.subtitle-text.faded {
  opacity: 0;
}

/* 3. Bottom Action Dock: Velvet Core Button (62px) */
footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  z-index: 10;
}

.action-stack {
  position: relative;
  width: 62px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.action-btn {
  position: absolute;
  top: 0;
  left: 0;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  outline: none;
  background: #1c251f;
  box-shadow: 
    0 2px 4px rgba(28, 37, 31, 0.12),
    0 12px 28px -4px rgba(28, 37, 31, 0.28);
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, opacity 0.3s ease;
}

.action-btn:hover {
  transform: scale(1.05);
}

.action-btn:active {
  transform: scale(0.96);
}

.action-btn::before {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
}

.btn-start::before {
  background: var(--green);
  box-shadow: 0 0 16px var(--green-glow);
  animation: coreBreathe 2.6s ease-in-out infinite;
}

@keyframes coreBreathe {
  0%, 100% {
    transform: scale(1);
    opacity: 0.85;
    box-shadow: 0 0 12px var(--green-glow);
  }
  50% {
    transform: scale(1.15);
    opacity: 1;
    box-shadow: 0 0 20px rgba(36, 91, 70, 0.55);
  }
}

.btn-end::before {
  background: var(--red);
  box-shadow: 0 0 16px var(--red-glow);
}

.action-btn svg {
  position: relative;
  z-index: 2;
  width: 23px;
  height: 23px;
  fill: #FFFFFF;
}

.btn-start {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

body.call .btn-start {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.75);
}

.btn-end {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.75);
}

body.call .btn-end {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.label-stack {
  position: relative;
  margin-top: 18px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-label {
  position: absolute;
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: -0.01em;
  white-space: nowrap;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.label-start {
  opacity: 1;
  transform: translateY(0);
}

body.call .label-start {
  opacity: 0;
  transform: translateY(-4px);
}

.label-end {
  opacity: 0;
  transform: translateY(4px);
}

body.call .label-end {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .title-shimmer, .btn-start::before { animation: none; }
  * { transition: none !important; }
}

/* Persistent Copyable Error Panel */
.error-panel {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 90%;
  max-width: 360px;
  padding: 22px 24px;
  background: #FFFFFF;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(32, 41, 35, 0.14), 0 1px 3px rgba(32, 41, 35, 0.06);
  border: 1px solid rgba(200, 61, 54, 0.22);
  z-index: 50;
  animation: errorPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: text !important;
  -webkit-user-select: text !important;
}

.error-panel, .error-panel * {
  user-select: text !important;
  -webkit-user-select: text !important;
}

@keyframes errorPop {
  0% { opacity: 0; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1); }
}

.error-badge {
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--red);
  background: rgba(200, 61, 54, 0.08);
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 12px;
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: text;
}

.error-detail {
  font-size: 0.92rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 18px;
  word-break: break-word;
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: text;
}

.error-dismiss-btn {
  background: #1c251f;
  color: #FFFFFF;
  border: none;
  font-family: var(--font);
  font-size: 0.88rem;
  font-weight: 600;
  padding: 10px 26px;
  border-radius: 24px;
  cursor: pointer !important;
  user-select: none !important;
  -webkit-user-select: none !important;
  box-shadow: 0 2px 8px rgba(32, 41, 35, 0.18);
  transition: transform 0.18s ease;
}

.error-dismiss-btn:active {
  transform: scale(0.96);
}
</style>
</head>
<body class="idle">

<div class="app-container">
  <!-- 1. Centered Stacked Header: 72px Portrait + Title -->
  <header class="header-lockup">
    <div class="avatar-frame">
      <img src="img/vijay.jpg" alt="Ungal Vijay" onerror="this.onerror=null; this.src='frontend/img/vijay.jpg';">
    </div>
    <h1 class="title-shimmer">உங்கள் விஜய்</h1>
  </header>

  <!-- 2. Middle Area -->
  <main>
    <!-- State 1: Idle -->
    <p class="idle-prompt">அரசு நலத்திட்டங்கள் பற்றி கேளுங்கள்</p>

    <!-- State 2: Active Call -->
    <div class="call-stage">
      <div class="equalizer-container">
        <canvas id="eq" aria-hidden="true"></canvas>
      </div>
      <div class="subtitle-stream">
        <p class="subtitle-text" id="subs" aria-live="polite"></p>
      </div>
    </div>

    <!-- State 3: Persistent Error Panel -->
    <div class="error-panel" id="error-panel" role="alert">
      <div class="error-badge">இணைப்பு பிழை / Notice</div>
      <p class="error-detail" id="error-detail"></p>
      <button type="button" class="error-dismiss-btn" id="error-dismiss-btn">சரி (மூடு)</button>
    </div>
  </main>

  <!-- 3. Bottom Action Dock: Velvet Core Button -->
  <footer>
    <div class="action-stack">
      <button class="action-btn btn-start" id="btn-start" aria-label="இணைப்பைத் தொடங்கவும்">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <button class="action-btn btn-end" id="btn-end" aria-label="இணைப்பைத் துண்டிக்கவும்">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
    </div>
    <div class="label-stack">
      <span class="status-label label-start">இணைப்பைத் தொடங்கவும்</span>
      <span class="status-label label-end">இணைப்பைத் துண்டிக்கவும்</span>
    </div>
  </footer>
</div>

<!-- Standalone Google Solved Modules -->
<script src="geminilive.js"></script>
<script src="mediaUtils.js"></script>

<script>
(function() {
  'use strict';

  // --------------------------------------------------------------------------
  // Global State (Declared at top, matching Google's script.js)
  // --------------------------------------------------------------------------
  let active = false;
  let client = null;
  let streamer = null;
  let player = null;
  let wakeLock = null;

  // --------------------------------------------------------------------------
  // DOM References & Helper
  // --------------------------------------------------------------------------
  const $ = s => document.querySelector(s);
  const body = document.body;
  const cv = $('#eq');
  const g = cv.getContext('2d');
  const subs = $('#subs');
  const errPanel = $('#error-panel');
  const errDetail = $('#error-detail');
  const errDismiss = $('#error-dismiss-btn');

  function showError(msg) {
    console.error('Call Error:', msg);
    if (errDetail) errDetail.textContent = msg;
    if (errPanel) errPanel.style.display = 'flex';
  }

  if (errDismiss) {
    errDismiss.addEventListener('click', () => {
      if (errPanel) errPanel.style.display = 'none';
    });
  }

  // --------------------------------------------------------------------------
  // Subtitle Manager (Max 3 lines, sliding window, auto-fade)
  // --------------------------------------------------------------------------
  let currentSubtitleText = '';
  let subsFadeTimer = null;

  function appendSubtitle(textChunk) {
    if (!textChunk) return;
    subs.classList.remove('faded');
    clearTimeout(subsFadeTimer);

    currentSubtitleText += textChunk;

    // Sliding window: keep the last ~140-160 characters so it fits 3 lines without growing
    if (currentSubtitleText.length > 170) {
      const trimmed = currentSubtitleText.slice(-135);
      const firstSpace = trimmed.indexOf(' ');
      currentSubtitleText = firstSpace > 0 ? '...' + trimmed.slice(firstSpace) : trimmed;
    }
    subs.textContent = currentSubtitleText;
  }

  function scheduleSubtitleFade() {
    clearTimeout(subsFadeTimer);
    subsFadeTimer = setTimeout(() => {
      subs.classList.add('faded');
      setTimeout(() => {
        if (subs.classList.contains('faded')) {
          currentSubtitleText = '';
          subs.textContent = '';
        }
      }, 500);
    }, 2800);
  }

  function clearSubtitles() {
    clearTimeout(subsFadeTimer);
    currentSubtitleText = '';
    subs.textContent = '';
    subs.classList.remove('faded');
  }

  // --------------------------------------------------------------------------
  // Equalizer Visualizer (25 Capsule Bars, Pure Memory Array, No AudioNodes)
  // --------------------------------------------------------------------------
  const BAR_COUNT = 25;
  const smoothed = new Array(BAR_COUNT).fill(4);
  let W = 0, H = 0, dpr = 1;
  let raf = null;
  let speakerEnergy = 0;
  let micEnergy = 0;

  function sizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = cv.getBoundingClientRect();
    W = rect.width || cv.parentElement?.clientWidth || 224;
    H = rect.height || 54;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawEqualizer() {
    if (!active) return;
    raf = requestAnimationFrame(drawEqualizer);

    if (W <= 0 || H <= 0) sizeCanvas();

    g.clearRect(0, 0, W, H);
    g.fillStyle = '#202923';

    const gap = W / BAR_COUNT;
    const barWidth = 3;
    const restHeight = 4;
    const mid = (BAR_COUNT - 1) / 2;

    // Read combined energy from Vijay's voice or caller's voice
    const currentEnergy = Math.max(speakerEnergy, micEnergy);
    speakerEnergy *= 0.85;
    micEnergy *= 0.85;

    for (let i = 0; i < BAR_COUNT; i++) {
      const distFromCenter = Math.abs(i - mid) / mid;
      let energy = 0;
      if (currentEnergy > 0.03) {
        energy = Math.min(1.0, currentEnergy * (1 - distFromCenter * 0.35));
      }
      const targetHeight = restHeight + Math.pow(energy, 1.1) * (H - restHeight) * 0.95;
      const smoothFactor = energy > 0 ? 0.40 : 0.22;
      smoothed[i] += (targetHeight - smoothed[i]) * smoothFactor;

      const barHeight = Math.max(restHeight, Math.min(H, smoothed[i]));
      const x = i * gap + (gap - barWidth) / 2;
      const y = (H - barHeight) / 2;
      const radius = barWidth / 2;

      g.beginPath();
      if (g.roundRect) {
        g.roundRect(x, y, barWidth, barHeight, radius);
      } else {
        g.rect(x, y, barWidth, barHeight);
      }
      g.fill();
    }
  }

  // --------------------------------------------------------------------------
  // Backend API URL (Routes to Railway when hosted on Cloudflare Pages)
  // --------------------------------------------------------------------------
  const RAILWAY_BACKEND = 'https://ungal-vijay-production.up.railway.app';
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? ''
    : RAILWAY_BACKEND;

  // --------------------------------------------------------------------------
  // Start Call (Direct Gemini Live Connection via Google's Solved Client)
  // --------------------------------------------------------------------------
  async function startCall() {
    if (active) return;
    active = true;

    body.className = 'call';
    clearSubtitles();
    subs.textContent = 'இணைக்கிறது... (Connecting...)';
    if (errPanel) errPanel.style.display = 'none';

    sizeCanvas();
    drawEqualizer();

    try {
      wakeLock = await navigator.wakeLock?.request('screen').catch(() => null);
    } catch (e) {}

    try {
      // Step 1: Fetch runtime configuration and ephemeral token from Railway backend
      const [tokenRes, configRes] = await Promise.all([
        fetch(`${API_BASE}/api/token`, { method: 'POST' }),
        fetch(`${API_BASE}/api/config`)
      ]);

      if (!tokenRes.ok) {
        const errText = await tokenRes.text();
        throw new Error('Token generation failed: ' + errText);
      }
      if (!configRes.ok) {
        throw new Error('Failed to load server configuration');
      }

      const { token } = await tokenRes.json();
      const config = await configRes.json();

      if (!active) return; // User hung up during fetch

      // Step 2: Initialize Google GeminiLiveAPI client
      client = new GeminiLiveAPI(token, config.model || "gemini-2.0-flash-exp");
      client.systemInstructions = config.system_instruction || "";
      client.voiceName = config.voice || "Puck";
      client.responseModalities = ["AUDIO"];
      client.outputAudioTranscription = true;
      client.inputAudioTranscription = true;

      // Register tools from config
      if (Array.isArray(config.tools)) {
        for (const toolDecl of config.tools) {
          const tool = new FunctionCallDefinition(
            toolDecl.name,
            toolDecl.description,
            toolDecl.parameters,
            toolDecl.parameters?.required || []
          );
          tool.functionToCall = async (params) => {
            console.log(`Executing tool: ${toolDecl.name}`, params);
            const res = await fetch(`${API_BASE}/api/${toolDecl.name}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(params || {})
            });
            return await res.json();
          };
          client.addFunction(tool);
        }
      }

      // Step 3: Register callbacks
      client.onReceiveResponse = handleMessage;
      client.onError = (err) => {
        console.error('Gemini error:', err);
        showError(typeof err === 'string' ? err : (err.message || 'Gemini connection error'));
        if (active) endCall();
      };
      client.onClose = () => {
        console.log('Gemini Live session closed');
        if (active) endCall();
      };

      // Step 4: Initialize Google Reference Audio Player (24kHz)
      if (!player) player = new AudioPlayer();
      await player.init();

      // Connect energy hook to player for equalizer & echo suppression
      player.onAudioLevel = (rms) => {
        speakerEnergy = Math.min(1.0, rms * 4.5);
        if (streamer) streamer.isModelSpeaking = (rms > 0.02);
      };

      // Step 5: Connect directly to Gemini Live WebSocket
      await client.connect();

      // Step 6: Start microphone streaming via Google AudioStreamer (16kHz)
      if (!streamer) streamer = new AudioStreamer(client);
      streamer.client = client;

      // Connect energy hook to streamer for equalizer
      streamer.onAudioLevel = (rms) => {
        micEnergy = Math.min(1.0, rms * 4.5);
      };

      await streamer.start();

    } catch (err) {
      console.error('Failed to start call:', err);
      showError(err.message || 'அழைப்பைத் தொடங்குவதில் பிழை ஏற்பட்டது.');
      endCall();
    }
  }

  // --------------------------------------------------------------------------
  // Handle Incoming Messages from Gemini Live API (Google Solved Logic)
  // --------------------------------------------------------------------------
  async function handleMessage(message) {
    if (message.type === MultimodalLiveResponseType.SETUP_COMPLETE) {
      console.log('🏁 Gemini Live setup complete. Prompting opening greeting...');
      clearSubtitles();
      if (client && client.connected) {
        client.sendClientContentMessage(
          "Call connected. Greet the citizen now with the official opening greeting in spoken Tanglish.",
          true
        );
      }
      return;
    }

    if (message.type === MultimodalLiveResponseType.AUDIO) {
      if (player) {
        player.play(message.data);
      }
      return;
    }

    if (message.type === MultimodalLiveResponseType.OUTPUT_TRANSCRIPTION) {
      if (message.data && message.data.text) {
        appendSubtitle(message.data.text);
      }
      return;
    }

    if (message.type === MultimodalLiveResponseType.INTERRUPTED) {
      console.log('🛑 Model interrupted by user voice');
      if (player) player.interrupt();
      clearSubtitles();
      speakerEnergy = 0;
      return;
    }

    if (message.type === MultimodalLiveResponseType.TURN_COMPLETE) {
      console.log('Turn complete');
      scheduleSubtitleFade();
      return;
    }

    if (message.type === MultimodalLiveResponseType.TOOL_CALL) {
      console.log('🛠️ Tool call received:', message.data);
      const functionCalls = message.data.functionCalls || [];
      Promise.all(
        functionCalls.map(async (call) => {
          const { name, id, args } = call;
          try {
            const result = await client.callFunction(name, args);
            return { id, name, response: { result: result ?? 'ok' } };
          } catch (err) {
            console.error(`Error executing tool ${name}:`, err);
            return { id, name, response: { error: err.message } };
          }
        })
      ).then((responses) => {
        if (client && client.connected) {
          client.sendToolResponse(responses);
        }
      });
      return;
    }
  }

  // --------------------------------------------------------------------------
  // End Call & Complete Teardown
  // --------------------------------------------------------------------------
  function endCall() {
    active = false;
    body.className = 'idle';

    if (raf) {
      cancelAnimationFrame(raf);
      raf = null;
    }

    if (g && W && H) {
      g.clearRect(0, 0, W, H);
      smoothed.fill(4);
    }
    speakerEnergy = 0;
    micEnergy = 0;
    clearSubtitles();

    if (streamer) {
      try { streamer.destroy(); } catch (e) {}
      streamer = null;
    }

    if (player) {
      try {
        player.interrupt();
        player.destroy();
      } catch (e) {}
      player = null;
    }

    if (client) {
      try { client.disconnect(); } catch (e) {}
      client = null;
    }

    if (wakeLock) {
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }

  // Wire buttons with synchronous iOS touch gesture unlock
  $('#btn-start').addEventListener('click', () => {
    // Synchronous unlock for iOS Safari
    if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
      try {
        if (!player) player = new AudioPlayer();
        player.warmup();
        if (!streamer) streamer = new AudioStreamer(client);
        streamer.warmup();
      } catch (e) {
        console.warn('Audio warmup notice:', e);
      }
    }
    startCall();
  });

  $('#btn-end').addEventListener('click', endCall);

  window.addEventListener('resize', () => active && sizeCanvas());
  window.addEventListener('beforeunload', () => active && endCall());
  window.addEventListener('pagehide', () => active && endCall());
  window.addEventListener('unload', () => active && endCall());
})();
</script>
</body>
</html>
